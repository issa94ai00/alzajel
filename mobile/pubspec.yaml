name: alzajel_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1  # تمت الإضافة

flutter:
  uses-material-design: true

  # مجلد الأصول
  assets:
    - assets/icons/

# تكوين أيقونة التطبيق
flutter_launcher_icons:
  android: true
  # لا يوجد مجلد ios/ في هذا المشروع (المنصات: android + windows)، وتفعيلها
  # يُجهض توليد أيقونات أندرويد بأكمله. أعِدها إلى true بعد `flutter create --platforms=ios .`
  ios: false
  image_path: "assets/icons/app_icon.png"
  # أزرق الشعار (متوسط التدرّج) — يمتد خلف الطبقة الأمامية فتبدو الأيقونة
  # قطعة واحدة بدل مربّع أزرق طافٍ على أبيض.
  adaptive_icon_background: "#2E3094"
  adaptive_icon_foreground: "assets/icons/icon_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  # المشروع يدعم Windows أيضاً — بدونها تبقى أيقونة Flutter الافتراضية في
  # شريط المهام وعنوان النافذة.
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 256